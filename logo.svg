<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <defs>
    <linearGradient id="logoPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(4, 5)">
    <!-- Base container -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#1C2541" />
    <!-- Pin -->
    <path d="M20 7 C14.2 7 9.5 11.7 9.5 17.5 C9.5 24.8 20 34 20 34 C20 34 30.5 24.8 30.5 17.5 C30.5 11.7 25.8 7 20 7 Z" fill="url(#logoPinGrad)" />
    <!-- Inner Radar / Ranking Indicator -->
    <circle cx="20" cy="17.5" r="5.5" fill="#0B132B" />
    <path d="M17.5 20 L20 15 L22.5 20 Z" fill="#38BDF8" />
  </g>
  
  <!-- Brand Text -->
  <text x="56" y="27" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5" fill="url(#textGrad)">
    Map<tspan fill="#38BDF8">Rank</tspan>
  </text>
  <text x="56" y="41" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="9" letter-spacing="1.8" fill="#94A3B8">
    GMB &amp; LOCAL SEO
  </text>
</svg>
